name: fintech-app

services:
  # -------------------------------------------------------------
  # CAPA DE PERSISTENCIA: Motor Relacional PostgreSQL 18
  # -------------------------------------------------------------
  postgres-db:
    image: postgres:18-alpine
    container_name: postgres-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_fintech_data:/var/lib/postgresql/18/docker
    networks:
      fintech-network:
        aliases:
          - postgres-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------
  # CAPA DE APLICACIÓN: Backend API REST (Node.js + Prisma)
  # -------------------------------------------------------------
  backend:
    build:
      context: ../fintech-core-app
      dockerfile: Dockerfile
    container_name: fintech-backend
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      PORT: 3000
    ports:
      - "${BACKEND_PORT}:3000"
    networks:
      - fintech-network
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # -------------------------------------------------------------
  # CAPA DE PRESENTACIÓN: Frontend Cliente Web (React + Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ../fintech-core-front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:${BACKEND_PORT}}
    container_name: fintech-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - fintech-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  fintech-network:
    driver: bridge

volumes:
  postgres_fintech_data:
