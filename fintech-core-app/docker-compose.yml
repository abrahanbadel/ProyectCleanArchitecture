# Compose local solo backend + Postgres (el monorepo usa ../docker-compose.yml para full stack).
services:
  postgres:
    image: postgres:18
    container_name: fintech-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-fintech_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fintech_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: fintech-app
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-fintech_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      JWT_EXPIRES_IN: 8h
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
